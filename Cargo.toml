[package]
name = "norbert"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Felipe Balbi <felipe@balbi.sh>"]

[dependencies]
pico-de-gallo-hal = "0.6"
pico-de-gallo-lib = "0.6"          # MAX_TRANSFER_SIZE, list_devices
embedded-hal = "1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 2
