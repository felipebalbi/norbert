[package]
name = "norbert"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Felipe Balbi <felipe@balbi.sh>"]
description = "A patient SPI-NOR flasher for the Pico de Gallo: read JEDEC/SFDP, erase, program, verify, and boot bitstreams."
readme = "README.md"
repository = "https://github.com/felipebalbi/norbert"
homepage = "https://github.com/felipebalbi/norbert"
documentation = "https://docs.rs/norbert"
keywords = ["spi-nor", "flash", "jedec", "sfdp", "programmer"]
categories = ["command-line-utilities", "embedded", "hardware-support"]

# docs.rs builds on Linux with network access blocked. Our `nusb` dependency
# (via pico-de-gallo-*) needs libudev there, which fails in that sandbox. Build
# the docs for Windows instead, where nusb uses WinUSB and needs no system libs.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-gnu"
targets = []

[dependencies]
pico-de-gallo-hal = "0.6"
pico-de-gallo-lib = "0.7"          # MAX_TRANSFER_SIZE, list_devices
embedded-hal = "1.0"               # blocking OutputPin for the bus-hold GPIO
embedded-hal-async = "1.0"         # async SpiDevice for the flash core
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
indicatif = "0.18"                 # progress bars for erase/program/verify
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 2
