[package]
name = "norbert"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Felipe Balbi <felipe@balbi.sh>"]

[dependencies]
pico-de-gallo-hal = "0.6"
pico-de-gallo-lib = "0.6"          # MAX_TRANSFER_SIZE, list_devices
embedded-hal = "1.0"               # blocking OutputPin for the bus-hold GPIO
embedded-hal-async = "1.0"         # async SpiDevice for the flash core
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
indicatif = "0.18"                 # progress bars for erase/program/verify
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 2
